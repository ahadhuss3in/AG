<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI-Engine RAG Tester</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid #2a2d34;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .thread {
    font-size: 12px;
    color: #8a8f98;
  }
  header button {
    background: #2a2d34;
    color: #e6e6e6;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  header button:hover { background: #3a3d44; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 75%; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 14px;
  }
  .msg.user .bubble { background: #3a5ba0; color: white; }
  .msg.assistant .bubble { background: #1c1f26; border: 1px solid #2a2d34; }

  .meta {
    margin-top: 6px;
    font-size: 11px;
    color: #8a8f98;
  }
  details.sources {
    margin-top: 6px;
    font-size: 12px;
  }
  details.sources summary {
    cursor: pointer;
    color: #7aa2f7;
  }
  .source-item {
    background: #14161b;
    border: 1px solid #2a2d34;
    border-radius: 8px;
    padding: 8px;
    margin-top: 6px;
    font-size: 12px;
    color: #b8bcc4;
    max-height: 120px;
    overflow-y: auto;
  }

  #inputRow {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid #2a2d34;
  }
  #inputRow input {
    flex: 1;
    background: #1c1f26;
    border: 1px solid #2a2d34;
    color: #e6e6e6;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #inputRow input:focus { border-color: #3a5ba0; }
  #inputRow button {
    background: #3a5ba0;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  #inputRow button:disabled { background: #2a2d34; cursor: default; }

  .typing { color: #8a8f98; font-size: 13px; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>AI-Engine — RAG Tester</h1>
  <div>
    <span class="thread" id="threadLabel"></span>
    <button id="newThreadBtn">New conversation</button>
  </div>
</header>

<div id="chat"></div>

<div id="inputRow">
  <input id="input" type="text" placeholder="Ask something..." autocomplete="off">
  <button id="sendBtn">Send</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const threadLabel = document.getElementById('threadLabel');
const newThreadBtn = document.getElementById('newThreadBtn');

function newThreadId() {
  return 'thread-' + Math.random().toString(36).slice(2, 10);
}

function getThreadId() {
  let id = localStorage.getItem('rag_thread_id');
  if (!id) {
    id = newThreadId();
    localStorage.setItem('rag_thread_id', id);
  }
  return id;
}

let threadId = getThreadId();
threadLabel.textContent = threadId;

newThreadBtn.onclick = () => {
  threadId = newThreadId();
  localStorage.setItem('rag_thread_id', threadId);
  threadLabel.textContent = threadId;
  chatEl.innerHTML = '';
};

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}

function addAssistantExtras(wrap, data) {
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = (data.status || '') + (data.thought_process ? '  ·  ' + data.thought_process.join(' → ') : '');
  wrap.appendChild(meta);

  if (data.sources && data.sources.length > 0) {
    const details = document.createElement('details');
    details.className = 'sources';
    const summary = document.createElement('summary');
    summary.textContent = `${data.sources.length} source chunk(s) used`;
    details.appendChild(summary);
    data.sources.forEach(s => {
      const item = document.createElement('div');
      item.className = 'source-item';
      item.textContent = s;
      details.appendChild(item);
    });
    wrap.appendChild(details);
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  addMessage('user', text);
  const typingWrap = addMessage('assistant', '');
  typingWrap.querySelector('.bubble').innerHTML = '<span class="typing">thinking...</span>';

  try {
    const resp = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: text, thread_id: threadId }),
    });
    const data = await resp.json();
    typingWrap.querySelector('.bubble').textContent = data.answer || '(no answer returned)';
    addAssistantExtras(typingWrap, data);
  } catch (err) {
    typingWrap.querySelector('.bubble').textContent = 'Request failed: ' + err;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});
</script>

</body>
</html>
